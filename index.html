body { margin: 0; font-family: 'Roboto', 'Noto Sans SC', system-ui, sans-serif; background-color: var(--md-surface); color: var(--md-on-surface); -webkit-font-smoothing: antialiased; padding-bottom: calc(100px + env(safe-area-inset-bottom)); }

<script>
(function () {
  'use strict';

  const WORKER_URL = "https://cookiew.xtz1.top";
  const $ = id => document.getElementById(id);
  const snackbar = $('snackbar');
  
  let snackTimer, busy = false, userFp = '', isVipMode = false;
  let currentChannelId = 0;

  function toast(msg) {
    snackbar.textContent = msg;
    snackbar.classList.add('show');
    clearTimeout(snackTimer);
    snackTimer = setTimeout(() => snackbar.classList.remove('show'), 2500);
  }

  async function generateFingerprint() {
    try {
      let savedFp = localStorage.getItem('user_fp');
      if (savedFp) return savedFp;
      const raw = [navigator.userAgent, screen.width + 'x' + screen.height, navigator.language, new Date().getTimezoneOffset()].join('|');
      let hash = 0;
      for (let i = 0; i < raw.length; i++) { hash = ((hash << 5) - hash) + raw.charCodeAt(i); hash = hash & hash; }
      const fp = 'FP_' + Math.abs(hash).toString(16).toUpperCase();
      localStorage.setItem('user_fp', fp);
      return fp;
    } catch(e) { return 'FP_TEMP_' + Math.floor(Math.random() * 100000); }
  }

  function copyText(text) {
    if (!text || text === '—') { toast('暂无内容'); return; }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => toast('已复制'));
    } else {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      toast('已复制');
    }
  }
  window.copyText = copyText;

  document.addEventListener('click', e => {
    const btn = e.target.closest('[data-copy]');
    if (btn) copyText($(btn.dataset.copy).textContent);
  });

  function log(msg, type) {
    const line = document.createElement('div');
    line.className = 'log-line' + (type ? ' log-' + type : '');
    line.textContent = `[${new Date().toLocaleTimeString('zh-CN', { hour12: false })}] ${msg}`;
    $('log').appendChild(line);
    $('log').scrollTop = $('log').scrollHeight;
  }

  function addHistory(username, password, cookies, channel, channelKey) {
    let history = JSON.parse(localStorage.getItem('cookies_history') || '[]');
    history.unshift({
      time: new Date().toLocaleString('zh-CN', { hour12: false }),
      username, password, cookies, channel, channelKey
    });
    if (history.length > 50) history.pop();
    localStorage.setItem('cookies_history', JSON.stringify(history));
    renderHistory();
  }

  function renderHistory(keyword = '') {
    let history = JSON.parse(localStorage.getItem('cookies_history') || '[]');
    if (keyword) {
      keyword = keyword.toLowerCase();
      history = history.filter(h => 
        (h.username && h.username.toLowerCase().includes(keyword)) ||
        (h.cookies && h.cookies.toLowerCase().includes(keyword))
      );
    }
    if (history.length === 0) {
      $('historyList').innerHTML = '<div style="font-size:12px;color:var(--md-on-surface-variant);text-align:center;padding:12px;">暂无匹配记录</div>';
      return;
    }
    
    $('historyList').innerHTML = history.map((h, i) => `
      <div class="history-item">
        <div class="history-time">${h.time} | 来自通道 ${h.channel}</div>
        <div class="history-data-row"><span>账号:</span> ${h.username}</div>
        <div class="history-data-row"><span>密码:</span> ${h.password}</div>
        <div class="history-data-row" style="max-height: 60px; overflow-y: auto;"><span>Cookie:</span> ${h.cookies || '暂无'}</div>
        <div class="history-actions">
          <button class="hist-btn" onclick="copyText('${h.username}')">复制账号</button>
          <button class="hist-btn primary" onclick="applyHistory(${i})">应用到面板</button>
        </div>
      </div>
    `).join('');
  }

  window.applyHistory = (index) => {
    let history = JSON.parse(localStorage.getItem('cookies_history') || '[]');
    const h = history[index];
    if(!h) return;

    $('channelRow').style.display = 'flex';
    $('outChannel').textContent = `历史通道 ${h.channel}`;
    $('outUser').textContent = h.username;
    $('outPass').textContent = h.password;
    $('outCookie').textContent = h.cookies || '—';
    $('voteGroup').style.display = 'none';
    toast('已应用历史记录');
  };

  $('historySearch').addEventListener('input', (e) => renderHistory(e.target.value));

  async function loadInfo() {
    try {
      const res = await fetch(`${WORKER_URL}/info?fp=${userFp}`, { cache: 'no-store' });
      const data = await res.json();
      if (data.ok) {
        $('totalUsers').textContent = data.totalUsers;
        $('totalUsers').style.opacity = '1';
        $('userQuota').style.opacity = '1';
        
        if (data.is_vip) {
          isVipMode = true;
          $('userQuota').textContent = '∞';
          $('userQuota').style.color = 'var(--md-primary)';
          $('userStatusText').textContent = `您今日已获取 ${data.used} 次 (无限额度)`;
          $('redeemCard').style.display = 'none';
          $('floatingAd').style.opacity = '0'; // VIP隐藏水印
          $('getBtn').disabled = false; $('btnText').textContent = '获取';
        } else {
          isVipMode = false;
          $('userQuota').textContent = data.remaining;
          $('userStatusText').textContent = `您今日已获取 ${data.used} 次`;
          if (data.remaining === 0) {
            $('userQuota').style.color = 'var(--md-error)';
            $('getBtn').disabled = true; $('btnText').textContent = '额度已用完';
          } else {
            $('userQuota').style.color = 'var(--md-primary)';
            $('getBtn').disabled = false; $('btnText').textContent = '获取';
          }
        }

        if (data.status === 'banned') {
          $('getBtn').disabled = true; $('btnText').textContent = '已封禁';
          $('userQuota').textContent = '0';
          $('userStatusText').textContent = '您的设备已被管理员封禁';
          $('userStatusText').style.color = 'var(--md-error)';
        }
      }
    } catch (e) {
      if ($('btnText').textContent === '正在初始化') {
        $('getBtn').disabled = false; $('btnText').textContent = '获取';
        $('userQuota').textContent = '?';
        $('userStatusText').textContent = '无法连接服务器，请刷新页面';
      }
    }
  }

  async function vote(action) {
    if (!currentChannelId) return;
    $('voteGroup').style.pointerEvents = 'none';
    try {
      await fetch(`${WORKER_URL}/vote?channel=${currentChannelId}&action=${action}`);
      toast(action === 'up' ? '已推荐该通道' : '已不推荐该通道');
    } catch(e) {}
  }
  window.vote = vote;

  $('redeemBtn').addEventListener('click', async () => {
    const cdk = $('cdkInput').value.trim();
    if (!cdk) return toast('请输入兑换码');
    
    $('redeemBtn').disabled = true;
    $('redeemBtn').textContent = '校验中…';
    try {
      const res = await fetch(`${WORKER_URL}/redeem?fp=${userFp}&cdk=${encodeURIComponent(cdk)}`);
      const data = await res.json();
      if (data.ok) {
        toast(data.msg);
        loadInfo();
      } else {
        toast(data.error);
        $('redeemBtn').disabled = false;
        $('redeemBtn').textContent = '兑换';
      }
    } catch(e) {
      toast('网络请求失败');
      $('redeemBtn').disabled = false;
      $('redeemBtn').textContent = '兑换';
    }
  });

  async function showTurnstile() {
    return new Promise(async (resolve) => {
      try {
        const res = await fetch(`${WORKER_URL}/info?fp=${userFp}`);
        const data = await res.json();
        const siteKey = data.turnstile_site_key;
        if (!siteKey) { toast("管理员未配置验证"); resolve(null); return; }

        const modal = $('turnstileModal');
        const container = $('turnstile-container');
        container.innerHTML = '';
        modal.classList.add('show');

        const widgetId = turnstile.render(container, {
          sitekey: siteKey,
          theme: document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light',
          callback: function(token) {
            modal.classList.remove('show');
            resolve(token);
          },
          'error-callback': function() {
            modal.classList.remove('show');
            resolve(null);
          }
        });

        $('closeModalBtn').onclick = () => {
          turnstile.remove(widgetId);
          modal.classList.remove('show');
          resolve(null);
        };
      } catch(e) { resolve(null); }
    });
  }

  let progressInterval;
  function startProgress() {
    $('progressWrap').classList.add('show');
    $('progressBar').style.width = '0%';
    let p = 0;
    progressInterval = setInterval(() => {
      if (p < 30) p += 10;
      else if (p < 60) p += 5;
      else if (p < 90) p += 1;
      $('progressBar').style.width = p + '%';
    }, 200);
  }

  function stopProgress() {
    clearInterval(progressInterval);
    $('progressBar').style.width = '100%';
    setTimeout(() => { $('progressWrap').classList.remove('show'); }, 300);
  }

  async function doFetch(token = '') {
    if (busy) return;
    busy = true;
    $('getBtn').disabled = true;
    $('spinner').classList.add('on');
    $('btnText').textContent = '获取账号中…';
    $('voteGroup').style.display = 'none';
    
    $('outChannel').textContent = '来源通道 —';
    $('outUser').textContent = '—';
    $('outPass').textContent = '—';
    $('outCookie').textContent = '—';
    
    startProgress();

    try {
      const ignoreVotes = $('ignoreVotesSetting').checked;
      const claimUrl = `${WORKER_URL}/claim?fp=${userFp}&ignore_votes=${ignoreVotes}` + (token ? `&turnstile_token=${token}` : '');
      const claimRes = await fetch(claimUrl, { cache: 'no-store' });
      const claimData = await claimRes.json();

      if (!claimData.ok) {
        if (claimData.need_turnstile) {
          stopProgress();
          log('触发风控限制，需要验证', 'err');
          $('spinner').classList.remove('on');
          $('btnText').textContent = '请完成验证';
          
          const newToken = await showTurnstile();
          busy = false;
          if (newToken) { doFetch(newToken); }
          else { $('getBtn').disabled = false; $('btnText').textContent = '获取'; }
          return;
        }
        throw new Error(claimData.error || '获取账号失败');
      }

      const { channel, channel_key, username, password, remaining } = claimData;
      currentChannelId = channel;

      $('outChannel').textContent = `来源通道 ${channel}`;
      $('outUser').textContent = username;
      $('outPass').textContent = password;
      $('voteGroup').style.display = 'flex';
      $('voteGroup').style.pointerEvents = 'auto';

      if (isVipMode) {
        $('userQuota').textContent = '∞';
        log(`账号获取成功！(无限额度)`, 'ok');
      } else {
        $('userQuota').textContent = remaining;
        log(`账号获取成功！剩余 ${remaining} 次`, 'ok');
      }
      
      loadInfo();
      $('btnText').textContent = '转换 Cookie 中…';

      const convUrl = `${WORKER_URL}/convert?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&key=${channel_key}`;
      const convRes = await fetch(convUrl, { cache: 'no-store' });
      const convData = await convRes.json();

      if (!convData.ok) {
        throw new Error('Cookie 转换失败，请稍后再试');
      }

      const cookies = convData.cookies;
      $('outCookie').textContent = cookies;
      stopProgress();
      log(`Cookie 转换成功`, 'ok');
      toast('获取成功');

      addHistory(username, password, cookies, channel, channel_key);

    } catch (e) {
      stopProgress();
      log(`失败: ${e.message}`, 'err');
      toast(e.message);
    } finally {
      busy = false;
      $('spinner').classList.remove('on');
      if ($('btnText').textContent !== '已封禁' && $('btnText').textContent !== '额度已用完') {
        $('getBtn').disabled = false;
        $('btnText').textContent = '获取';
      }
    }
  }

  $('settingsBtn').addEventListener('click', () => $('settingsModal').classList.add('show'));
  $('closeSettingsBtn').addEventListener('click', () => {
    $('settingsModal').classList.remove('show');
    localStorage.setItem('ignore_votes', $('ignoreVotesSetting').checked);
  });

  (async function init() {
    if (localStorage.getItem('ignore_votes') === 'true') {
      $('ignoreVotesSetting').checked = true;
    }

    try {
      userFp = await generateFingerprint();
    } catch(e) { userFp = 'FP_FALLBACK_' + Date.now(); }
    
    await loadInfo(); 
    
    if ($('btnText').textContent === '正在初始化') {
      $('getBtn').disabled = false;
      $('btnText').textContent = '获取';
      $('userStatusText').textContent = '就绪';
    }

    $('getBtn').addEventListener('click', () => doFetch());
    renderHistory();
  })();

  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    $('iconSun').style.display = theme === 'dark' ? 'none' : '';
    $('iconMoon').style.display = theme === 'dark' ? '' : 'none';
  }
  applyTheme(mq.matches ? 'dark' : 'light');
  $('themeBtn').addEventListener('click', () => {
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  });
})();
</script>
</body>
</html>
