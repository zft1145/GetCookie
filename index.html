<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>4399 账号与 Cookies</title>
<style>
:root{
  --md-primary:#6750A4; --md-on-primary:#fff;
  --md-secondary-container:#E8DEF8; --md-on-secondary-container:#1D192B;
  --md-surface:#FEF7FF; --md-surface-container-low:#F7F2FA;
  --md-surface-container:#F3EDF7; --md-surface-container-high:#ECE6F0;
  --md-surface-container-highest:#E6E0E9;
  --md-on-surface:#1D1B20; --md-on-surface-variant:#49454F;
  --md-outline-variant:#CAC4D0;
  --md-error:#B3261E; --md-success:#386A20;
  --md-elev1:0 1px 2px rgba(0,0,0,.30),0 1px 3px 1px rgba(0,0,0,.15);
  --md-elev2:0 1px 2px rgba(0,0,0,.30),0 2px 6px 2px rgba(0,0,0,.15);
}
html[data-theme="dark"]{
  --md-primary:#D0BCFF; --md-on-primary:#381E72;
  --md-secondary-container:#4A4458; --md-on-secondary-container:#E8DEF8;
  --md-surface:#141218; --md-surface-container-low:#1D1B20;
  --md-surface-container:#211F26; --md-surface-container-high:#2B2930;
  --md-surface-container-highest:#36343B;
  --md-on-surface:#E6E0E9; --md-on-surface-variant:#CAC4D0;
  --md-outline-variant:#49454F;
  --md-error:#F2B8B5; --md-success:#B6F09C;
  --md-elev1:0 1px 2px rgba(0,0,0,.55),0 1px 3px 1px rgba(0,0,0,.30);
  --md-elev2:0 1px 2px rgba(0,0,0,.55),0 2px 6px 2px rgba(0,0,0,.30);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;font-family:'Roboto','Noto Sans SC',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:14px;line-height:1.5;background:var(--md-surface);color:var(--md-on-surface);
  -webkit-font-smoothing:antialiased;transition:background-color .25s,color .25s;
}
.app-bar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
  height:64px;padding:0 8px 0 20px;background:var(--md-surface-container);
}
.app-bar h1{margin:0;font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.icon-button{
  width:48px;height:48px;flex:0 0 48px;border:none;border-radius:50%;
  background:transparent;color:var(--md-on-surface-variant);
  display:grid;place-items:center;cursor:pointer;transition:background .15s;
}
.icon-button:hover{background:var(--md-surface-container-high)}
.content{max-width:640px;margin:0 auto;padding:16px 16px 96px}
.card{background:var(--md-surface-container-low);border-radius:16px;padding:20px;margin-bottom:16px}
.card-title{margin:0 0 12px;font-size:15px;font-weight:500}
.label{font-size:12px;letter-spacing:.4px;color:var(--md-on-surface-variant);margin-bottom:6px}

/* 额度面板 */
.quota-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
.quota-card { background: var(--md-surface-container); padding: 12px; border-radius: 12px; text-align: center; }
.quota-card .k { font-size: 12px; color: var(--md-on-surface-variant); margin-bottom: 4px; }
.quota-card .v { font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; }

.filled-button{
  position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;height:52px;border:none;border-radius:100px;
  background:var(--md-primary);color:var(--md-on-primary);
  font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;
  transition:box-shadow .2s,opacity .2s;
}
.filled-button:hover{box-shadow:var(--md-elev1)}
.filled-button:disabled{opacity:.55;cursor:default;box-shadow:none}
.spinner{
  width:18px;height:18px;border-radius:50%;border:2px solid currentColor;
  border-top-color:transparent;animation:spin .7s linear infinite;display:none;
}
.spinner.on{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

.result-row{
  display:flex;align-items:center;gap:8px;padding:12px 6px 12px 16px;
  border-radius:12px;background:var(--md-surface-container);margin-bottom:10px;
}
.result-row .info{flex:1;min-width:0}
.result-row .k{font-size:11.5px;color:var(--md-on-surface-variant)}
.result-row .v{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:15px;margin-top:2px;word-break:break-all;
}
.result-block{border-radius:12px;background:var(--md-surface-container);padding:12px 6px 12px 16px}
.result-block-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cookie-box{
  margin:8px 10px 0 0;padding:12px 14px;border-radius:12px;
  background:var(--md-surface-container-high);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12.5px;line-height:1.65;white-space:pre-wrap;word-break:break-all;
  max-height:200px;overflow:auto;color:var(--md-on-surface);
}
.copy-btn{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;
  border:none;background:transparent;color:var(--md-primary);
  font-family:inherit;font-size:13px;font-weight:500;
  padding:8px 14px;border-radius:100px;cursor:pointer;transition:background .15s;
}
.copy-btn:hover{background:rgba(103,80,164,.08)}
.log{
  height:150px;overflow:auto;padding:12px;border-radius:12px;
  background:var(--md-surface-container-high);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12px;line-height:1.7;color:var(--md-on-surface-variant);
}
.log-line{white-space:pre-wrap;word-break:break-all}
.log-ok{color:var(--md-success)}
.log-err{color:var(--md-error)}
.snackbar{
  position:fixed;left:50%;bottom:24px;z-index:100;transform:translate(-50%,140%);
  max-width:calc(100% - 32px);padding:14px 20px;border-radius:8px;
  background:var(--md-surface-container-highest);color:var(--md-on-surface);
  font-size:14px;box-shadow:var(--md-elev2);opacity:0;pointer-events:none;
  transition:transform .3s cubic-bezier(.2,0,0,1),opacity .3s;
}
.snackbar.show{transform:translate(-50%,0);opacity:1}
</style>
</head>
<body>

<header class="app-bar">
  <h1>4399 账号与 Cookies</h1>
  <div class="spacer"></div>
  <button class="icon-button" id="themeBtn" aria-label="切换主题">
    <svg id="iconSun" width="22" height="22" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
    <svg id="iconMoon" width="22" height="22" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linejoin="round" style="display:none">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </svg>
  </button>
</header>

<main class="content">

  <section class="card">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px">
      <div>
        <div class="label">密钥托管</div>
        <div style="font-size:14px">后端 Worker 持有，前端不可见</div>
      </div>
    </div>

    <!-- 额度展示区 -->
    <div class="quota-grid" id="quotaGrid">
      <div class="quota-card"><div class="k">通道 1</div><div class="v" id="q1">未知</div></div>
      <div class="quota-card"><div class="k">通道 2</div><div class="v" id="q2">未知</div></div>
      <div class="quota-card"><div class="k">通道 3</div><div class="v" id="q3">未知</div></div>
    </div>

    <button class="filled-button" id="getBtn">
      <span class="spinner" id="spinner"></span>
      <span id="btnText">获取</span>
    </button>
  </section>

  <section class="card">
    <h2 class="card-title">提取结果</h2>

    <div class="result-row">
      <div class="info">
        <div class="k">来源通道</div>
        <div class="v" id="outChannel" style="color:var(--md-primary)">—</div>
      </div>
    </div>

    <div class="result-row">
      <div class="info">
        <div class="k">账号</div>
        <div class="v" id="outUser">—</div>
      </div>
      <button class="copy-btn" data-copy="outUser">复制</button>
    </div>

    <div class="result-row">
      <div class="info">
        <div class="k">密码</div>
        <div class="v" id="outPass">—</div>
      </div>
      <button class="copy-btn" data-copy="outPass">复制</button>
    </div>

    <div class="result-block">
      <div class="result-block-head">
        <div class="k label" style="margin:0">Cookie获取</div>
        <button class="copy-btn" data-copy="outCookie">复制</button>
      </div>
      <pre class="cookie-box" id="outCookie">—</pre>
    </div>
  </section>

  <section class="card">
    <h2 class="card-title">运行日志</h2>
    <div class="log" id="log"></div>
  </section>

</main>

<div class="snackbar" id="snackbar"></div>

<script>
(function () {
  'use strict';

  const WORKER_URL = "https://cookiew.xtz1.top";
  const TIMEOUT = 30000;

  const $ = id => document.getElementById(id);
  const getBtn = $('getBtn');
  const btnText = $('btnText');
  const spinner = $('spinner');
  const logEl = $('log');
  const snackbar = $('snackbar');

  let busy = false;

  // 读取并初始化额度
  function initQuota() {
    for (let i = 1; i <= 3; i++) {
      const val = localStorage.getItem('quota_ch' + i);
      if (val !== null) {
        $('q' + i).textContent = val;
      }
    }
  }

  // 更新并保存额度
  function updateQuota(channel, remaining) {
    if (remaining !== null && remaining !== undefined) {
      const el = $('q' + channel);
      if (el) {
        el.textContent = remaining;
        localStorage.setItem('quota_ch' + channel, remaining);
      }
    }
  }

  function setText(id, t) { const el = $(id); if (el) el.textContent = t; }

  function log(msg, type) {
    const line = document.createElement('div');
    line.className = 'log-line' + (type ? ' log-' + type : '');
    const t = new Date().toLocaleTimeString('zh-CN', { hour12: false });
    line.textContent = '[' + t + '] ' + msg;
    logEl.appendChild(line);
    while (logEl.children.length > 50) logEl.removeChild(logEl.firstChild);
    logEl.scrollTop = logEl.scrollHeight;
  }

  let snackTimer;
  function toast(msg) {
    snackbar.textContent = msg;
    snackbar.classList.add('show');
    clearTimeout(snackTimer);
    snackTimer = setTimeout(() => snackbar.classList.remove('show'), 2200);
  }

  function setBusy(on) {
    busy = on;
    getBtn.disabled = on;
    spinner.classList.toggle('on', on);
    btnText.textContent = on ? '获取中…' : '获取';
  }

  // 复制功能
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.top = '-9999px'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
    }
    return Promise.resolve(fallbackCopy(text));
  }

  document.addEventListener('click', e => {
    const btn = e.target.closest('[data-copy]');
    if (!btn) return;
    const target = $(btn.dataset.copy);
    const text = target ? target.textContent : '';
    if (!text || text === '—') { toast('暂无可复制内容'); return; }
    copyText(text).then(() => toast('已复制到剪贴板'));
  });

  // 请求
  function fetchJson(url, ms) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    const t0 = performance.now();
    return fetch(url, { cache: 'no-store', signal: ctrl.signal })
      .then(res => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(data => {
        const elapsed = Math.round(performance.now() - t0);
        return { data, elapsed };
      })
      .catch(err => {
        if (err.name === 'AbortError') throw new Error(`超时（${ms / 1000}秒）`);
        throw err;
      })
      .finally(() => clearTimeout(timer));
  }

  // 主流程
  async function run() {
    if (busy) return;
    if (!WORKER_URL) { toast('请先填写 WORKER_URL'); return; }

    setBusy(true);
    setText('outChannel', '—');
    setText('outUser', '—');
    setText('outPass', '—');
    setText('outCookie', '—');

    log('开始获取…');

    try {
      const { data, elapsed } = await fetchJson(WORKER_URL.replace(/\/+$/, '') + '/run', TIMEOUT);

      // 不管成功与否，先尝试更新额度
      if (data.channel && data.remaining != null) {
        updateQuota(data.channel, data.remaining);
      }

      if (!data.ok) {
        log(`获取失败（${elapsed}ms）：${data.error || '未知错误'}`, 'err');
        toast(data.error || '获取失败');
        return;
      }

      setText('outChannel', `通道 ${data.channel}`);
      setText('outUser', data.username || '—');
      setText('outPass', data.password || '—');
      
      if (!data.cookies) {
        setText('outCookie', '解析失败');
        log(`通道 ${data.channel} 获取成功，但无 Cookie`, 'err');
        toast('获取成功，但 Cookie 为空');
        return;
      }

      setText('outCookie', data.cookies);
      log(`通道 ${data.channel} 获取成功（${elapsed}ms）`, 'ok');
      toast('获取完成');

    } catch (e) {
      log(`获取失败：${e.message}`, 'err');
      toast('请求失败，请重试');
    } finally {
      setBusy(false);
    }
  }

  getBtn.addEventListener('click', run);

  // 主题切换
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    $('iconSun').style.display = theme === 'dark' ? 'none' : '';
    $('iconMoon').style.display = theme === 'dark' ? '' : 'none';
  }
  applyTheme(mq.matches ? 'dark' : 'light');
  if (mq.addEventListener) mq.addEventListener('change', e => applyTheme(e.matches ? 'dark' : 'light'));
  $('themeBtn').addEventListener('click', () => {
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  });

  // 初始化
  initQuota();
  log('就绪，点击获取开始。');
})();
</script>
</body>
</html>
