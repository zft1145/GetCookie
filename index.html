<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>4399 账号与 Cookies</title>
<style>
:root{
  --md-primary:#6750A4; --md-on-primary:#fff;
  --md-secondary-container:#E8DEF8; --md-on-secondary-container:#1D192B;
  --md-surface:#FEF7FF; --md-surface-container-low:#F7F2FA;
  --md-surface-container:#F3EDF7; --md-surface-container-high:#ECE6F0;
  --md-surface-container-highest:#E6E0E9;
  --md-on-surface:#1D1B20; --md-on-surface-variant:#49454F;
  --md-outline-variant:#CAC4D0;
  --md-error:#B3261E; --md-success:#386A20;
  --md-elev1:0 1px 2px rgba(0,0,0,.30),0 1px 3px 1px rgba(0,0,0,.15);
  --md-elev2:0 1px 2px rgba(0,0,0,.30),0 2px 6px 2px rgba(0,0,0,.15);
}
html[data-theme="dark"]{
  --md-primary:#D0BCFF; --md-on-primary:#381E72;
  --md-secondary-container:#4A4458; --md-on-secondary-container:#E8DEF8;
  --md-surface:#141218; --md-surface-container-low:#1D1B20;
  --md-surface-container:#211F26; --md-surface-container-high:#2B2930;
  --md-surface-container-highest:#36343B;
  --md-on-surface:#E6E0E9; --md-on-surface-variant:#CAC4D0;
  --md-outline-variant:#49454F;
  --md-error:#F2B8B5; --md-success:#B6F09C;
  --md-elev1:0 1px 2px rgba(0,0,0,.55),0 1px 3px 1px rgba(0,0,0,.30);
  --md-elev2:0 1px 2px rgba(0,0,0,.55),0 2px 6px 2px rgba(0,0,0,.30);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;font-family:'Roboto','Noto Sans SC',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:14px;line-height:1.5;background:var(--md-surface);color:var(--md-on-surface);
  -webkit-font-smoothing:antialiased;transition:background-color .25s,color .25s;
}
.app-bar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
  height:64px;padding:0 8px 0 20px;background:var(--md-surface-container);
}
.app-bar h1{margin:0;font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.icon-button{
  width:48px;height:48px;flex:0 0 48px;border:none;border-radius:50%;
  background:transparent;color:var(--md-on-surface-variant);
  display:grid;place-items:center;cursor:pointer;transition:background .15s;
}
.icon-button:hover{background:var(--md-surface-container-high)}
.content{max-width:640px;margin:0 auto;padding:16px 16px 96px}
.card{background:var(--md-surface-container-low);border-radius:16px;padding:20px;margin-bottom:16px}
.card-title{margin:0 0 12px;font-size:15px;font-weight:500}
.label{font-size:12px;letter-spacing:.4px;color:var(--md-on-surface-variant);margin-bottom:6px}

/* 用户界面专属 */
.user-quota-box { display: flex; flex-direction: column; align-items: center; padding: 16px 0 24px 0; }
.user-quota-box .k { font-size: 13px; color: var(--md-on-surface-variant); margin-bottom: 4px; }
.user-quota-box .v { font-size: 40px; font-weight: 600; color: var(--md-primary); font-variant-numeric: tabular-nums; line-height: 1.2; }

.filled-button{
  position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;height:52px;border:none;border-radius:100px;
  background:var(--md-primary);color:var(--md-on-primary);
  font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;
  transition:box-shadow .2s,opacity .2s;
}
.filled-button:hover{box-shadow:var(--md-elev1)}
.filled-button:disabled{opacity:.55;cursor:default;box-shadow:none}
.spinner{
  width:18px;height:18px;border-radius:50%;border:2px solid currentColor;
  border-top-color:transparent;animation:spin .7s linear infinite;display:none;
}
.spinner.on{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

.result-row{
  display:flex;align-items:center;gap:8px;padding:12px 6px 12px 16px;
  border-radius:12px;background:var(--md-surface-container);margin-bottom:10px;
}
.result-row .info{flex:1;min-width:0}
.result-row .k{font-size:11.5px;color:var(--md-on-surface-variant)}
.result-row .v{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:15px;margin-top:2px;word-break:break-all;
}
.result-block{border-radius:12px;background:var(--md-surface-container);padding:12px 6px 12px 16px}
.result-block-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cookie-box{
  margin:8px 10px 0 0;padding:12px 14px;border-radius:12px;
  background:var(--md-surface-container-high);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12.5px;line-height:1.65;white-space:pre-wrap;word-break:break-all;
  max-height:200px;overflow:auto;color:var(--md-on-surface);
}
.copy-btn{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;
  border:none;background:transparent;color:var(--md-primary);
  font-family:inherit;font-size:13px;font-weight:500;
  padding:8px 14px;border-radius:100px;cursor:pointer;transition:background .15s;
}
.copy-btn:hover{background:rgba(103,80,164,.08)}
.log{
  height:150px;overflow:auto;padding:12px;border-radius:12px;
  background:var(--md-surface-container-high);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12px;line-height:1.7;color:var(--md-on-surface-variant);
}
.log-line{white-space:pre-wrap;word-break:break-all}
.log-ok{color:var(--md-success)}
.log-err{color:var(--md-error)}
.snackbar{
  position:fixed;left:50%;bottom:24px;z-index:100;transform:translate(-50%,140%);
  max-width:calc(100% - 32px);padding:14px 20px;border-radius:8px;
  background:var(--md-surface-container-highest);color:var(--md-on-surface);
  font-size:14px;box-shadow:var(--md-elev2);opacity:0;pointer-events:none;
  transition:transform .3s cubic-bezier(.2,0,0,1),opacity .3s;
}
.snackbar.show{transform:translate(-50%,0);opacity:1}

/* Admin 样式 */
.admin-list { border: 1px solid var(--md-outline-variant); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
.admin-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--md-outline-variant); background: var(--md-surface-container-lowest); }
.admin-item:last-child { border-bottom: none; }
.badge { padding: 4px 8px; border-radius: 8px; font-size: 12px; font-weight: 500; }
.badge.on { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
.badge.off { background: var(--md-error-container); color: var(--md-on-error-container); }
</style>
</head>
<body>

<header class="app-bar">
  <h1 id="pageTitle">4399 账号与 Cookies</h1>
  <div class="spacer"></div>
  <button class="icon-button" id="themeBtn" aria-label="切换主题">
    <svg id="iconSun" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg id="iconMoon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<main class="content" id="appContent">
  <!-- 动态渲染内容 -->
</main>

<div class="snackbar" id="snackbar"></div>

<script>
(function () {
  'use strict';

  const WORKER_URL = "https://cookiew.xtz1.top";
  const ADMIN_KEY = new URLSearchParams(location.search).get('key');
  const $ = id => document.getElementById(id);
  const snackbar = $('snackbar');
  let snackTimer;
  
  function toast(msg) {
    snackbar.textContent = msg;
    snackbar.classList.add('show');
    clearTimeout(snackTimer);
    snackTimer = setTimeout(() => snackbar.classList.remove('show'), 2200);
  }

  // ================= 浏览器指纹生成 =================
  // 通过 UA, 分辨率, 语言, 时区 等生成稳定指纹
  async function generateFingerprint() {
    let savedFp = localStorage.getItem('user_fp');
    if (savedFp) return savedFp;

    const raw = [
      navigator.userAgent,
      screen.width + 'x' + screen.height,
      navigator.language,
      new Date().getTimezoneOffset(),
      navigator.hardwareConcurrency || 'unknown',
      navigator.deviceMemory || 'unknown'
    ].join('|');

    // 简单 Hash 函数
    let hash = 0;
    for (let i = 0; i < raw.length; i++) {
      const char = raw.charCodeAt(i);
      hash = ((hash << 5) - hash) + char;
      hash = hash & hash;
    }
    const fp = 'FP_' + Math.abs(hash).toString(16).toUpperCase();
    localStorage.setItem('user_fp', fp);
    return fp;
  }

  // ================= 复制 =================
  function copyText(text) {
    if (!text || text === '—') { toast('暂无内容'); return; }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => toast('已复制'));
    } else {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      toast('已复制');
    }
  }

  document.addEventListener('click', e => {
    const btn = e.target.closest('[data-copy]');
    if (btn) copyText($(btn.dataset.copy).textContent);
  });

  // ================= 渲染: 用户界面 =================
  async function renderUser() {
    const fp = await generateFingerprint();
    $('pageTitle').textContent = '4399 账号与 Cookies';
    
    $('appContent').innerHTML = `
      <section class="card">
        <div class="user-quota-box">
          <div class="k">今日剩余可获取账号数</div>
          <div class="v" id="userQuota">-</div>
        </div>
        <button class="filled-button" id="getBtn">
          <span class="spinner" id="spinner"></span>
          <span id="btnText">获取</span>
        </button>
      </section>

      <section class="card">
        <h2 class="card-title">提取结果</h2>
        <div class="result-row">
          <div class="info"><div class="k">来源通道</div><div class="v" id="outChannel" style="color:var(--md-primary)">—</div></div>
        </div>
        <div class="result-row">
          <div class="info"><div class="k">账号</div><div class="v" id="outUser">—</div></div>
          <button class="copy-btn" data-copy="outUser">复制</button>
        </div>
        <div class="result-row">
          <div class="info"><div class="k">密码</div><div class="v" id="outPass">—</div></div>
          <button class="copy-btn" data-copy="outPass">复制</button>
        </div>
        <div class="result-block">
          <div class="result-block-head">
            <div class="k label" style="margin:0">Cookie获取</div>
            <button class="copy-btn" data-copy="outCookie">复制</button>
          </div>
          <pre class="cookie-box" id="outCookie">—</pre>
        </div>
      </section>
      <section class="card">
        <h2 class="card-title">运行日志</h2>
        <div class="log" id="log"></div>
      </section>
    `;

    const getBtn = $('getBtn');
    const spinner = $('spinner');
    const btnText = $('btnText');
    const logEl = $('log');
    let busy = false;

    function log(msg, type) {
      const line = document.createElement('div');
      line.className = 'log-line' + (type ? ' log-' + type : '');
      line.textContent = `[${new Date().toLocaleTimeString('zh-CN', { hour12: false })}] ${msg}`;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setQuota(val) {
      $('userQuota').textContent = val;
      if (val === 0) $('userQuota').style.color = 'var(--md-error)';
      else $('userQuota').style.color = 'var(--md-primary)';
    }

    // 初始查询额度 (可通过空转查询？直接调个接口)
    // 因为目前 API 没有专门查额度的，只能初始显示未知，成功后更新
    setQuota('-'); 

    getBtn.addEventListener('click', async () => {
      if (busy) return;
      busy = true;
      getBtn.disabled = true;
      spinner.classList.add('on');
      btnText.textContent = '获取中…';
      
      $('outChannel').textContent = '—';
      $('outUser').textContent = '—';
      $('outPass').textContent = '—';
      $('outCookie').textContent = '—';
      
      log('正在请求服务器…');
      try {
        const res = await fetch(`${WORKER_URL}/run?fp=${fp}`, { cache: 'no-store' });
        const data = await res.json();
        
        if (!data.ok) {
          log(`失败: ${data.error}`, 'err');
          toast(data.error);
          if (data.error.includes('额度已用完')) setQuota(0);
          return;
        }

        $('outChannel').textContent = `通道 ${data.channel}`;
        $('outUser').textContent = data.username;
        $('outPass').textContent = data.password;
        $('outCookie').textContent = data.cookies || '解析失败';
        setQuota(data.remaining);
        log(`获取成功！剩余 ${data.remaining} 次`, 'ok');
        toast('获取成功');
      } catch (e) {
        log(`网络异常: ${e.message}`, 'err');
        toast('网络异常');
      } finally {
        busy = false;
        getBtn.disabled = false;
        spinner.classList.remove('on');
        btnText.textContent = '获取';
      }
    });
  }

  // ================= 渲染: Admin 界面 =================
  async function renderAdmin() {
    $('pageTitle').textContent = '后台管理 · 4399 通道';
    
    $('appContent').innerHTML = `
      <section class="card">
        <h2 class="card-title">通道状态管理</h2>
        <div class="admin-list" id="channelList">加载中…</div>
      </section>

      <section class="card">
        <h2 class="card-title">已使用用户 (按指纹)</h2>
        <div class="admin-list" id="userList">加载中…</div>
      </section>
    `;

    const channelList = $('channelList');
    const userList = $('userList');

    async function loadData() {
      try {
        const res = await fetch(`${WORKER_URL}/admin/api?key=${ADMIN_KEY}`);
        const data = await res.json();
        if (!data.ok) {
          channelList.innerHTML = `<div style="color:red; padding:16px">${data.msg}</div>`;
          return;
        }

        // 渲染通道
        channelList.innerHTML = data.channels.map(c => `
          <div class="admin-item">
            <div>
              <strong>${c.name}</strong><br>
              <span style="font-size:12px;color:var(--md-on-surface-variant)">${c.key}</span>
            </div>
            <button class="copy-btn" onclick="toggleChannel(${c.id}, ${!c.active})" style="color:${c.active?'var(--md-success)':'var(--md-error)'}">
              ${c.active ? '开启中' : '已关闭'}
            </button>
          </div>
        `).join('');

        // 渲染用户
        const userKeys = Object.keys(data.users);
        if (userKeys.length === 0) {
          userList.innerHTML = `<div style="padding:16px;color:var(--md-on-surface-variant)">暂无用户记录</div>`;
        } else {
          userList.innerHTML = userKeys.map(fp => {
            const u = data.users[fp];
            return `
            <div class="admin-item">
              <div>
                <strong>${fp}</strong><br>
                <span style="font-size:12px;color:var(--md-on-surface-variant)">今日已用: ${u.count} / 20</span>
              </div>
              <button class="copy-btn" onclick="toggleUser('${fp}', '${u.status === 'active' ? 'banned' : 'active'}')" style="color:${u.status === 'active' ? 'var(--md-primary)' : 'var(--md-error)'}">
                ${u.status === 'active' ? '正常 (点击封禁)' : '已封禁 (点击解封)'}
              </button>
            </div>
            `;
          }).join('');
        }
      } catch (e) {
        toast('加载失败');
      }
    }

    // 绑定到全局供 HTML onclick 使用
    window.toggleChannel = async (id, active) => {
      await fetch(`${WORKER_URL}/admin/api?key=${ADMIN_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'toggle_channel', id, active })
      });
      loadData();
    };

    window.toggleUser = async (fingerprint, status) => {
      await fetch(`${WORKER_URL}/admin/api?key=${ADMIN_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'ban_user', fingerprint, status })
      });
      loadData();
    };

    loadData();
  }

  // ================= 初始化路由 =================
  // 主题
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    $('iconSun').style.display = theme === 'dark' ? 'none' : '';
    $('iconMoon').style.display = theme === 'dark' ? '' : 'none';
  }
  applyTheme(mq.matches ? 'dark' : 'light');
  $('themeBtn').addEventListener('click', () => {
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  });

  // 根据 URL 参数判断渲染哪种页面
  if (ADMIN_KEY) {
    renderAdmin();
  } else {
    renderUser();
  }

})();
</script>
</body>
</html>
