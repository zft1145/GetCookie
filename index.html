<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>4399 账号与 Cookies</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<style>
:root {
  --md-primary: #6750A4; --md-on-primary: #FFFFFF;
  --md-primary-container: #EADDFF; --md-on-primary-container: #21005D;
  --md-surface: #FEF7FF; --md-surface-container-low: #F7F2FA;
  --md-surface-container: #F3EDF7; --md-surface-container-high: #ECE6F0;
  --md-surface-container-highest: #E6E0E9;
  --md-on-surface: #1D1B20; --md-on-surface-variant: #49454F;
  --md-outline: #79747E; --md-outline-variant: #CAC4D0;
  --md-error: #B3261E; --md-success: #386A20;
  --md-elev1: 0px 1px 2px rgba(0,0,0,0.3), 0px 1px 3px 1px rgba(0,0,0,0.15);
  --md-elev2: 0px 1px 2px rgba(0,0,0,0.3), 0px 2px 6px 2px rgba(0,0,0,0.15);
}
html[data-theme="dark"] {
  --md-primary: #D0BCFF; --md-on-primary: #381E72;
  --md-primary-container: #4F378B; --md-on-primary-container: #EADDFF;
  --md-surface: #141218; --md-surface-container-low: #1D1B20;
  --md-surface-container: #211F26; --md-surface-container-high: #2B2930;
  --md-surface-container-highest: #36343B;
  --md-on-surface: #E6E0E9; --md-on-surface-variant: #CAC4D0;
  --md-outline: #938F99; --md-outline-variant: #49454F;
  --md-error: #F2B8B5; --md-success: #B6F09C;
  --md-elev1: 0px 1px 2px rgba(0,0,0,0.55), 0px 1px 3px 1px rgba(0,0,0,0.30);
  --md-elev2: 0px 1px 2px rgba(0,0,0,0.55), 0px 2px 6px 2px rgba(0,0,0,0.30);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; font-family: 'Roboto', 'Noto Sans SC', system-ui, sans-serif;
  background-color: var(--md-surface); color: var(--md-on-surface);
  -webkit-font-smoothing: antialiased; transition: background-color 0.3s, color 0.3s;
  padding-bottom: 100px; /* 留出悬浮窗空间 */
}
.app-bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; height: 64px; padding: 0 16px; background-color: var(--md-surface); }
.app-bar h1 { margin: 0; font-size: 22px; font-weight: 400; flex: 1; }
.icon-button { width: 48px; height: 48px; border: none; border-radius: 50%; background: transparent; color: var(--md-on-surface-variant); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s; margin-right: -12px; }
.icon-button:hover { background: rgba(103,80,164,0.08); }

.container { max-width: 600px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.card { background-color: var(--md-surface-container-low); border-radius: 16px; padding: 24px; transition: background 0.3s; }
.card-title { margin: 0 0 16px 0; font-size: 16px; font-weight: 500; }

.status-layout { display: flex; align-items: center; justify-content: center; gap: 32px; margin-bottom: 24px; }
.status-item { text-align: center; }
.status-value { color: var(--md-primary); font-size: 45px; font-weight: 500; line-height: 1.1; margin: 4px 0; font-variant-numeric: tabular-nums; }
.status-divider { width: 1px; height: 48px; background-color: var(--md-outline-variant); }
.status-hint { text-align: center; color: var(--md-on-surface-variant); font-size: 14px; margin-bottom: 24px; }

.filled-button { display: flex; align-items: center; justify-content: center; width: 100%; height: 56px; border: none; border-radius: 999px; background: var(--md-primary); color: var(--md-on-primary); font-size: 16px; font-weight: 500; cursor: pointer; transition: box-shadow 0.2s, transform 0.1s, opacity 0.2s; box-shadow: var(--md-elev1); }
.filled-button:active { transform: scale(0.98); }
.filled-button:disabled { background: var(--md-on-surface-variant); color: var(--md-surface); opacity: 0.38; box-shadow: none; transform: none; }
.spinner { width: 20px; height: 20px; border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent; animation: spin 0.8s linear infinite; display: none; margin-right: 8px; }
.spinner.on { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }

.result-list { display: flex; flex-direction: column; gap: 12px; }
.result-item { display: flex; align-items: flex-start; justify-content: space-between; padding: 16px; background: var(--md-surface-container); border-radius: 12px; }
.result-info { flex: 1; min-width: 0; }
.result-label { color: var(--md-on-surface-variant); font-size: 12px; margin-bottom: 4px; }
.result-text { font-family: monospace; font-size: 16px; color: var(--md-on-surface); word-break: break-all; white-space: pre-wrap; }
.text-primary { color: var(--md-primary); }

.cookie-block { background: var(--md-surface-container-high); border-radius: 12px; padding: 16px; }
.cookie-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cookie-content { font-family: monospace; font-size: 13px; line-height: 20px; color: var(--md-on-surface); word-break: break-all; white-space: pre-wrap; max-height: 200px; overflow-y: auto; background: var(--md-surface-container-lowest); padding: 12px; border-radius: 8px; border: 1px solid var(--md-outline-variant); }

.text-button { padding: 8px 16px; border: none; border-radius: 999px; background: transparent; color: var(--md-primary); font-weight: 500; cursor: pointer; transition: background 0.2s; }
.text-button:hover { background: rgba(103,80,164,0.08); }

.log-box { height: 120px; overflow-y: auto; background: var(--md-surface-container-highest); border-radius: 8px; padding: 12px; font-family: monospace; font-size: 12px; color: var(--md-on-surface-variant); display: flex; flex-direction: column; gap: 4px; }
.log-ok { color: var(--md-success); }
.log-err { color: var(--md-error); }

/* 底部兑换码 */
.redeem-box { display: flex; gap: 8px; }
.redeem-box input {
  flex: 1; padding: 0 16px; height: 48px; border-radius: 8px;
  border: 1px solid var(--md-outline-variant);
  background: var(--md-surface-container); color: var(--md-on-surface);
  font-family: inherit; font-size: 14px;
}
.redeem-box input:focus { outline: none; border-color: var(--md-primary); }
.redeem-btn {
  height: 48px; padding: 0 24px; border-radius: 8px; border: none;
  background: var(--md-primary); color: var(--md-on-primary);
  font-weight: 500; cursor: pointer; transition: opacity 0.2s;
}
.redeem-btn:disabled { opacity: 0.5; cursor: default; }

/* 右下角贴边悬浮窗 */
.floating-ad {
  position: fixed; right: 0; bottom: 24px; z-index: 100;
  background: linear-gradient(135deg, #6750A4, #D0BCFF);
  color: #FFF; text-decoration: none;
  padding: 12px 20px;
  border-radius: 16px 0 0 0; /* 左上角圆角 */
  box-shadow: -2px 2px 10px rgba(0,0,0,0.2);
  font-size: 13px; line-height: 1.4;
  display: flex; flex-direction: column; align-items: flex-start;
  transform: translateX(5px);
  transition: transform 0.2s;
}
.floating-ad:hover { transform: translateX(0); }
.floating-ad strong { font-size: 14px; color: #FFF; }
.floating-ad span { color: #EADDFF; font-size: 12px; }

/* Modal */
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 200; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.modal-overlay.show { opacity: 1; pointer-events: auto; }
.modal-box { background: var(--md-surface-container-high); border-radius: 28px; padding: 24px; width: 90%; max-width: 360px; text-align: center; transform: scale(0.95); transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1); }
.modal-overlay.show .modal-box { transform: scale(1); }
#turnstile-container { display: flex; justify-content: center; margin: 16px 0; min-height: 65px; }
.snackbar { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--md-surface-container-highest); color: var(--md-on-surface); padding: 14px 24px; border-radius: 8px; box-shadow: var(--md-elev1); font-size: 14px; opacity: 0; pointer-events: none; transition: transform 0.3s, opacity 0.3s; z-index: 1000; }
.snackbar.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<header class="app-bar">
  <h1>4399 账号与 Cookies</h1>
  <button class="icon-button" id="themeBtn">
    <svg id="iconSun" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg id="iconMoon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<main class="container">
  <section class="card">
    <div class="status-layout">
      <div class="status-item">
        <div class="result-label">今日剩余额度</div>
        <div class="status-value" id="userQuota">-</div>
      </div>
      <div class="status-divider"></div>
      <div class="status-item">
        <div class="result-label">系统总用户数</div>
        <div class="status-value" id="totalUsers" style="color:var(--md-on-surface)">-</div>
      </div>
    </div>
    <div class="status-hint" id="userStatusText">正在获取状态…</div>
    <button class="filled-button" id="getBtn" disabled>
      <span class="spinner" id="spinner"></span>
      <span id="btnText">加载中…</span>
    </button>
  </section>

  <section class="card">
    <h2 class="card-title">提取结果</h2>
    <div class="result-list">
      <div class="result-item" style="padding: 12px 16px;">
        <div class="result-info">
          <div class="result-label">来源通道</div>
          <div class="result-text text-primary" id="outChannel" style="font-family:inherit">—</div>
        </div>
      </div>
      <div class="result-item">
        <div class="result-info">
          <div class="result-label">账号</div>
          <div class="result-text" id="outUser">—</div>
        </div>
        <button class="text-button" data-copy="outUser">复制</button>
      </div>
      <div class="result-item">
        <div class="result-info">
          <div class="result-label">密码</div>
          <div class="result-text" id="outPass">—</div>
        </div>
        <button class="text-button" data-copy="outPass">复制</button>
      </div>
      <div class="cookie-block">
        <div class="cookie-header">
          <div class="result-label" style="margin:0">Cookie获取</div>
          <button class="text-button" data-copy="outCookie">复制</button>
        </div>
        <div class="cookie-content" id="outCookie">—</div>
      </div>
    </div>
  </section>

  <section class="card">
    <h2 class="card-title">运行日志</h2>
    <div class="log-box" id="log"></div>
  </section>

  <!-- CDK 兑换卡片 -->
  <section class="card" id="redeemCard">
    <h2 class="card-title">兑换码激活</h2>
    <div class="redeem-box">
      <input type="text" id="cdkInput" placeholder="请输入兑换码">
      <button class="redeem-btn" id="redeemBtn">兑换</button>
    </div>
    <div id="vipStatusText" style="font-size:12px;color:var(--md-success);margin-top:8px;display:none;">已激活无限额度特权</div>
  </section>
</main>

<!-- 右下角悬浮广告 -->
<a href="https://qm.qq.com/q/Qa24XBm0w4" target="_blank" class="floating-ad">
  <strong>By VHax代理XTZ</strong>
  <span>无限额度点我获取</span>
</a>

<!-- 人机验证弹窗 -->
<div class="modal-overlay" id="turnstileModal">
  <div class="modal-box">
    <h2 style="margin:0 0 8px 0;color:var(--md-on-surface)">安全验证</h2>
    <p style="color:var(--md-on-surface-variant);font-size:13px;margin:0 0 16px 0">检测到操作频繁，请完成验证。</p>
    <div id="turnstile-container"></div>
    <button class="text-button" id="closeModalBtn" style="color:var(--md-on-surface-variant)">取消</button>
  </div>
</div>

<div class="snackbar" id="snackbar"></div>

<script>
(function () {
  'use strict';

  const WORKER_URL = "https://cookiew.xtz1.top";
  const $ = id => document.getElementById(id);
  const snackbar = $('snackbar');
  
  let snackTimer, busy = false, userFp = '';

  function toast(msg) {
    snackbar.textContent = msg;
    snackbar.classList.add('show');
    clearTimeout(snackTimer);
    snackTimer = setTimeout(() => snackbar.classList.remove('show'), 2500);
  }

  async function generateFingerprint() {
    let savedFp = localStorage.getItem('user_fp');
    if (savedFp) return savedFp;
    const raw = [navigator.userAgent, screen.width + 'x' + screen.height, navigator.language, new Date().getTimezoneOffset()].join('|');
    let hash = 0;
    for (let i = 0; i < raw.length; i++) { hash = ((hash << 5) - hash) + raw.charCodeAt(i); hash = hash & hash; }
    const fp = 'FP_' + Math.abs(hash).toString(16).toUpperCase();
    localStorage.setItem('user_fp', fp);
    return fp;
  }

  function copyText(text) {
    if (!text || text === '—') { toast('暂无内容'); return; }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => toast('已复制'));
    } else {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      toast('已复制');
    }
  }

  document.addEventListener('click', e => {
    const btn = e.target.closest('[data-copy]');
    if (btn) copyText($(btn.dataset.copy).textContent);
  });

  function log(msg, type) {
    const line = document.createElement('div');
    line.className = 'log-line' + (type ? ' log-' + type : '');
    line.textContent = `[${new Date().toLocaleTimeString('zh-CN', { hour12: false })}] ${msg}`;
    $('log').appendChild(line);
    $('log').scrollTop = $('log').scrollHeight;
  }

  async function loadInfo() {
    try {
      const res = await fetch(`${WORKER_URL}/info?fp=${userFp}`, { cache: 'no-store' });
      const data = await res.json();
      if (data.ok) {
        $('userQuota').textContent = data.remaining;
        $('totalUsers').textContent = data.totalUsers;
        $('userStatusText').textContent = `您今日已获取 ${data.used} 次`;
        
        if (data.is_vip) {
          $('redeemCard').style.display = 'none'; // 隐藏兑换框
          $('userStatusText').textContent += ' (VIP无限额度)';
        }

        if (data.remaining === 0) {
          $('userQuota').style.color = 'var(--md-error)';
          $('getBtn').disabled = true; $('btnText').textContent = '额度已用完';
        } else {
          $('userQuota').style.color = 'var(--md-primary)';
          $('getBtn').disabled = false; $('btnText').textContent = '获取';
        }
        
        if (data.status === 'banned') {
          $('getBtn').disabled = true; $('btnText').textContent = '已封禁';
          $('userQuota').textContent = '0';
          $('userStatusText').textContent = '您的设备已被管理员封禁';
          $('userStatusText').style.color = 'var(--md-error)';
        }
      }
    } catch (e) {
      $('userStatusText').textContent = '网络异常，获取状态失败';
    }
  }

  // 兑换处理
  $('redeemBtn').addEventListener('click', async () => {
    const cdk = $('cdkInput').value.trim();
    if (!cdk) return toast('请输入兑换码');
    
    $('redeemBtn').disabled = true;
    $('redeemBtn').textContent = '校验中…';
    try {
      const res = await fetch(`${WORKER_URL}/redeem?fp=${userFp}&cdk=${encodeURIComponent(cdk)}`);
      const data = await res.json();
      if (data.ok) {
        toast(data.msg);
        loadInfo(); // 刷新状态
      } else {
        toast(data.error);
        $('redeemBtn').disabled = false;
        $('redeemBtn').textContent = '兑换';
      }
    } catch(e) {
      toast('网络请求失败');
      $('redeemBtn').disabled = false;
      $('redeemBtn').textContent = '兑换';
    }
  });

  async function showTurnstile() {
    return new Promise(async (resolve) => {
      try {
        const res = await fetch(`${WORKER_URL}/info?fp=${userFp}`);
        const data = await res.json();
        const siteKey = data.turnstile_site_key;
        if (!siteKey) { toast("管理员未配置验证"); resolve(null); return; }

        const modal = $('turnstileModal');
        const container = $('turnstile-container');
        container.innerHTML = '';
        modal.classList.add('show');

        const widgetId = turnstile.render(container, {
          sitekey: siteKey,
          theme: document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light',
          callback: function(token) {
            modal.classList.remove('show');
            resolve(token);
          },
          'error-callback': function() {
            modal.classList.remove('show');
            resolve(null);
          }
        });

        $('closeModalBtn').onclick = () => {
          turnstile.remove(widgetId);
          modal.classList.remove('show');
          resolve(null);
        };
      } catch(e) { resolve(null); }
    });
  }

  async function doFetch(token = '') {
    if (busy) return;
    busy = true;
    $('getBtn').disabled = true;
    $('spinner').classList.add('on');
    $('btnText').textContent = '获取中…';
    
    $('outChannel').textContent = '—';
    $('outUser').textContent = '—';
    $('outPass').textContent = '—';
    $('outCookie').textContent = '—';
    
    log('正在请求服务器…');
    try {
      const url = `${WORKER_URL}/run?fp=${userFp}` + (token ? `&turnstile_token=${token}` : '');
      const res = await fetch(url, { cache: 'no-store' });
      const data = await res.json();
      
      if (!data.ok) {
        if (data.need_turnstile) {
          log('触发风控限制，需要验证', 'err');
          $('spinner').classList.remove('on');
          $('btnText').textContent = '请完成验证';
          
          const newToken = await showTurnstile();
          busy = false;
          if (newToken) { doFetch(newToken); }
          else { $('getBtn').disabled = false; $('btnText').textContent = '获取'; }
          return;
        }
        
        log(`失败: ${data.error}`, 'err');
        toast(data.error);
        if (data.error.includes('额度')) {
          $('userQuota').textContent = '0'; $('userQuota').style.color = 'var(--md-error)'; $('btnText').textContent = '额度已用完';
          return;
        }
        $('getBtn').disabled = false; $('btnText').textContent = '获取';
        return;
      }

      $('outChannel').textContent = `通道 ${data.channel}`;
      $('outUser').textContent = data.username;
      $('outPass').textContent = data.password;
      $('outCookie').textContent = data.cookies || '解析失败';
      
      $('userQuota').textContent = data.remaining;
      if (data.remaining === 0) {
        $('userQuota').style.color = 'var(--md-error)'; $('btnText').textContent = '额度已用完';
      } else {
        $('getBtn').disabled = false; $('btnText').textContent = '获取';
      }
      
      loadInfo(); 
      log(`获取成功！剩余 ${data.remaining} 次`, 'ok');
      toast('获取成功');
    } catch (e) {
      log(`网络异常: ${e.message}`, 'err');
      toast('网络异常');
      $('getBtn').disabled = false; $('btnText').textContent = '获取';
    } finally {
      busy = false;
      $('spinner').classList.remove('on');
    }
  }

  (async function init() {
    userFp = await generateFingerprint();
    await loadInfo();
    $('getBtn').addEventListener('click', () => doFetch());
  })();

  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    $('iconSun').style.display = theme === 'dark' ? 'none' : '';
    $('iconMoon').style.display = theme === 'dark' ? '' : 'none';
  }
  applyTheme(mq.matches ? 'dark' : 'light');
  $('themeBtn').addEventListener('click', () => {
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  });
})();
</script>
</body>
</html>
