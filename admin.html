<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>后台管理 · 4399 通道</title>
<style>
:root {
  --md-primary: #6750A4; --md-on-primary: #FFFFFF;
  --md-surface: #FEF7FF; --md-surface-container-low: #F7F2FA;
  --md-surface-container: #F3EDF7; --md-surface-container-high: #ECE6F0;
  --md-surface-container-highest: #E6E0E9;
  --md-on-surface: #1D1B20; --md-on-surface-variant: #49454F;
  --md-outline-variant: #CAC4D0; --md-error: #B3261E; --md-success: #386A20;
}
html[data-theme="dark"] {
  --md-primary: #D0BCFF; --md-on-primary: #381E72;
  --md-surface: #141218; --md-surface-container-low: #1D1B20;
  --md-surface-container: #211F26; --md-surface-container-high: #2B2930;
  --md-surface-container-highest: #36343B;
  --md-on-surface: #E6E0E9; --md-on-surface-variant: #CAC4D0;
  --md-outline-variant: #49454F; --md-error: #F2B8B5; --md-success: #B6F09C;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; font-family: 'Roboto', 'Noto Sans SC', sans-serif; background: var(--md-surface); color: var(--md-on-surface); }
.app-bar { display: flex; align-items: center; height: 64px; padding: 0 16px; background: var(--md-surface-container); }
.app-bar h1 { margin: 0; font-size: 20px; font-weight: 500; flex: 1; }
.icon-button { width: 48px; height: 48px; border-radius: 50%; border: none; background: transparent; color: var(--md-on-surface-variant); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.content { max-width: 640px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--md-surface-container-low); border-radius: 24px; padding: 20px; }
.card-title { margin: 0 0 16px 0; font-size: 15px; font-weight: 500; }
.input-group { margin-bottom: 12px; }
.input-group input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--md-outline-variant); background: var(--md-surface-container); color: var(--md-on-surface); font-family: inherit; font-size: 14px; }
.input-group input:focus { outline: none; border-color: var(--md-primary); }
.btn-row { display: flex; gap: 8px; margin-bottom: 12px; }
.btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 12px; border-radius: 100px; border: none; background: var(--md-primary); color: var(--md-on-primary); font-weight: 500; font-size: 14px; cursor: pointer; text-decoration: none; }
.btn-outline { background: transparent; color: var(--md-primary); border: 1px solid var(--md-outline-variant); }
.admin-list { border: 1px solid var(--md-outline-variant); border-radius: 16px; overflow: hidden; }
.admin-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--md-outline-variant); background: var(--md-surface-container-lowest); }
.admin-item:last-child { border-bottom: none; }
.copy-btn { border: none; background: transparent; color: var(--md-primary); cursor: pointer; font-weight: 500; font-size: 14px; padding: 6px 12px; border-radius: 100px; }
.snackbar { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 100px); background: var(--md-surface-container-highest); color: var(--md-on-surface); padding: 12px 24px; border-radius: 8px; font-size: 14px; opacity: 0; transition: all 0.3s; z-index: 100; }
.snackbar.show { transform: translate(-50%, 0); opacity: 1; }
</style>
</head>
<body>

<header class="app-bar">
  <h1>后台管理 · 4399</h1>
  <button class="icon-button" id="themeBtn">
    <svg id="iconSun" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg id="iconMoon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<main class="content">
  <section class="card" id="authCard" style="display:none">
    <h2 class="card-title">管理员鉴权</h2>
    <div class="input-group">
      <input type="password" id="adminKeyInput" placeholder="请输入管理员密钥">
    </div>
    <button class="btn" id="authBtn">验证进入</button>
  </section>

  <div class="btn-row" id="navBtns" style="display:none">
    <a href="https://4399pc.cc/account" target="_blank" class="btn btn-outline">曲奇 API 界面</a>
    <a href="https://cookie.xtz1.top" target="_blank" class="btn btn-outline">主站页面</a>
  </div>

  <section class="card" id="addChannelCard" style="display:none">
    <h2 class="card-title">增加新通道</h2>
    <div class="input-group">
      <input type="text" id="newChannelName" placeholder="通道名称 (例如: 通道 4)">
    </div>
    <div class="input-group">
      <input type="text" id="newChannelKey" placeholder="API 密钥 (aku_...)">
    </div>
    <button class="btn" id="addChannelBtn">保存通道</button>
  </section>

  <section class="card" id="dataCard" style="display:none">
    <h2 class="card-title">通道状态与投票</h2>
    <div class="admin-list" id="channelList">加载中…</div>
  </section>

  <section class="card" id="configCard" style="display:none">
    <h2 class="card-title">系统设置</h2>
    <div class="input-group">
      <input type="text" id="cfgSiteKey" placeholder="Turnstile Site Key">
    </div>
    <div class="input-group">
      <input type="text" id="cfgSecret" placeholder="Turnstile Secret Key">
    </div>
    <div class="input-group">
      <input type="text" id="cfgCdk" placeholder="兑换码 CDK">
    </div>
    <button class="btn btn-outline" id="saveConfigBtn">保存配置</button>
  </section>

  <section class="card" id="userCard" style="display:none">
    <h2 class="card-title">已使用用户</h2>
    <div class="admin-list" id="userList">加载中…</div>
  </section>
</main>

<div class="snackbar" id="snackbar"></div>

<script>
(function () {
  let ADMIN_KEY = new URLSearchParams(location.search).get('key') || '';
  const $ = id => document.getElementById(id);
  let snackTimer;

  function toast(msg) {
    $('snackbar').textContent = msg;
    $('snackbar').classList.add('show');
    clearTimeout(snackTimer);
    snackTimer = setTimeout(() => $('snackbar').classList.remove('show'), 2200);
  }

  async function loadData() {
    if (!ADMIN_KEY) return;
    try {
      const res = await fetch(`https://cookiew.xtz1.top/admin/api?key=${ADMIN_KEY}`);
      const data = await res.json();
      
      if (!data.ok) {
        toast(data.error || '鉴权失败');
        $('authCard').style.display = 'block';
        return;
      }

      $('authCard').style.display = 'none';
      ['navBtns','addChannelCard','dataCard','configCard','userCard'].forEach(id => {
        $(id).style.display = 'flex';
        if(id !== 'navBtns') $(id).style.display = 'block';
      });

      $('channelList').innerHTML = data.channels.map(c => `
        <div class="admin-item">
          <div>
            <strong>${c.name}</strong> <span style="font-size:12px;color:${c.votes>=0?'var(--md-success)':'var(--md-error)'}">(票数: ${c.votes||0})</span>
            <br><span style="font-size:12px;color:var(--md-on-surface-variant)">${c.key}</span>
          </div>
          <button class="copy-btn" onclick="toggleChannel(${c.id}, ${!c.active})" style="color:${c.active?'var(--md-success)':'var(--md-error)'}">
            ${c.active ? '开启中' : '已关闭'}
          </button>
        </div>
      `).join('');

      if (data.config) {
        $('cfgSiteKey').value = data.config.turnstile_site_key || '';
        $('cfgSecret').value = data.config.turnstile_secret || '';
        $('cfgCdk').value = data.config.cdk || '';
      }

      const userKeys = Object.keys(data.users);
      if (userKeys.length === 0) {
        $('userList').innerHTML = `<div style="padding:16px;font-size:14px;color:var(--md-on-surface-variant)">暂无记录</div>`;
      } else {
        $('userList').innerHTML = userKeys.map(fp => {
          const u = data.users[fp];
          const vipBadge = u.vip ? `<span style="color:#FFF;background:var(--md-primary);font-size:10px;padding:2px 6px;border-radius:4px;margin-left:6px;">VIP</span>` : '';
          const limit = u.vip ? 45 : 20;
          return `
          <div class="admin-item">
            <div>
              <strong>${fp} ${vipBadge}</strong><br>
              <span style="font-size:12px;color:var(--md-on-surface-variant)">今日已用: ${u.count} / ${limit}</span>
            </div>
            <button class="copy-btn" onclick="toggleUser('${fp}', '${u.status === 'active' ? 'banned' : 'active'}')" style="color:${u.status === 'active' ? 'var(--md-primary)' : 'var(--md-error)'}">
              ${u.status === 'active' ? '封禁' : '解封'}
            </button>
          </div>
          `;
        }).join('');
      }
    } catch (e) { toast('网络请求失败'); }
  }

  window.toggleChannel = async (id, active) => {
    await fetch(`https://cookiew.xtz1.top/admin/api?key=${ADMIN_KEY}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'toggle_channel', id, active })
    });
    loadData();
  };

  window.toggleUser = async (fingerprint, status) => {
    await fetch(`https://cookiew.xtz1.top/admin/api?key=${ADMIN_KEY}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'ban_user', fingerprint, status })
    });
    loadData();
  };

  $('authBtn').addEventListener('click', () => {
    const key = $('adminKeyInput').value.trim();
    if (key) { ADMIN_KEY = key; loadData(); }
  });

  $('addChannelBtn').addEventListener('click', async () => {
    const name = $('newChannelName').value.trim();
    const key = $('newChannelKey').value.trim();
    if (!name || !key) return toast('请填写完整信息');
    await fetch(`https://cookiew.xtz1.top/admin/api?key=${ADMIN_KEY}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'add_channel', name, key })
    });
    $('newChannelName').value = ''; $('newChannelKey').value = '';
    toast('添加成功'); loadData();
  });

  $('saveConfigBtn').addEventListener('click', async () => {
    const turnstile_site_key = $('cfgSiteKey').value.trim();
    const turnstile_secret = $('cfgSecret').value.trim();
    const cdk = $('cfgCdk').value.trim();
    await fetch(`https://cookiew.xtz1.top/admin/api?key=${ADMIN_KEY}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'save_config', config: { turnstile_site_key, turnstile_secret, cdk } })
    });
    toast('配置已保存');
  });

  if (ADMIN_KEY) loadData();
  else $('authCard').style.display = 'block';

  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    $('iconSun').style.display = theme === 'dark' ? 'none' : '';
    $('iconMoon').style.display = theme === 'dark' ? '' : 'none';
  }
  applyTheme(mq.matches ? 'dark' : 'light');
  $('themeBtn').addEventListener('click', () => {
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  });
})();
</script>
</body>
</html>
